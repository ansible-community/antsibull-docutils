minor_changes:
  - "The ``antsibull_docutils.text`` module allows to render documents as plain text with optional ANSI formatting.
     Nice formatting with Unicode aware grapheme splitting requires Python 3.15+ or the `graphemeu library <https://pypi.org/project/graphemeu/>`_,
     which can be installed through the ``[unicode]`` optional dependency group: ``pip install antsibull-docutils[unicode]``
     (https://github.com/ansible-community/antsibull-docutils/pull/40, https://github.com/ansible-community/antsibull-docutils/pull/43)."
